name: Daily Business News Agent

on:
  schedule:
    # Runs daily around 6:00 AM IST (12:27 AM UTC - off-peak minute to avoid delays)
    - cron: '27 0 * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  run-news-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py